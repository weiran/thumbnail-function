name: Deploy Function App

on:
  push:
    branches: [ master, main ]
    paths:
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/deploy-function-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_FUNCTIONAPP_NAME: hackers-thumbnails
      AZURE_FUNCTIONAPP_PACKAGE_PATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Azure OIDC secrets are configured
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing required Azure OIDC GitHub secrets."
            echo "Add AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID for the federated deployment identity."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Test thumbnail discovery and rendering
        run: npm test

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
